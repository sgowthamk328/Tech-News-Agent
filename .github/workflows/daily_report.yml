name: Daily Tech News Report

on:
  # Runs at 00:30 UTC every day = 06:00 AM IST
  schedule:
    - cron: "30 0 * * *"

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    name: Generate & Commit Report
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run Phase 1 + Phase 2 ───────────────────────────────────────────
      # generate_report.py internally calls fetch_news.get_daily_stories(),
      # so this single command runs both phases in the correct sequence.
      - name: Generate daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python generate_report.py --output-dir output

      # ── 5. Commit report back to repo ──────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          # Only commit if there is actually something new
          if git diff --staged --quiet; then
            echo "No new report to commit — skipping."
          else
            git commit -m "chore: add daily tech news report [skip ci]"
            git push
          fi
